<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .src{fill:#fff4e0;stroke:#a0640a;stroke-width:1.2}
      .box{fill:#f4f6f8;stroke:#333;stroke-width:1.2}
      .mcu{fill:#dde8f5;stroke:#1f4e79;stroke-width:2}
      .rail{fill:#e3f2e1;stroke:#2e7d32;stroke-width:1.6}
      .ln{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .t{fill:#111}
      .s{fill:#444;font-size:11px}
      .h{font-weight:bold;font-size:15px;fill:#1f4e79}
    </style>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" class="h">RadioBoard2027: host link, USB and power</text>

  <!-- host -->
  <rect x="20" y="60" width="210" height="230" rx="4" class="src"/>
  <text x="30" y="82" class="t">Control board (STM32)</text>
  <text x="30" y="100" class="s">via J9 ↔ J2 mezzanine</text>
  <text x="30" y="126" class="s">PB3 SPI3_SCK (R65 30 Ω)</text>
  <text x="30" y="146" class="s">PD6 SPI3_MOSI (R66 30 Ω)</text>
  <text x="30" y="166" class="s">PB4 SPI3_MISO</text>
  <text x="30" y="186" class="s">PB5 CS (10k pull-up)</text>
  <text x="30" y="206" class="s">PB6 HANDSHAKE (100k pull-down)</text>
  <text x="30" y="226" class="s">PB7 DATA_READY (10k pull-down)</text>
  <text x="30" y="246" class="s">PE1 ESP_RST (open drain)</text>
  <text x="30" y="270" class="s">+3V3 on J9 pins 1/3/5</text>

  <!-- ESD -->
  <rect x="290" y="105" width="165" height="70" rx="4" class="box"/>
  <text x="300" y="127" class="t">U5 TPD4E05U06</text>
  <text x="300" y="145" class="s">SCK, MOSI, MISO, CS</text>
  <text x="300" y="161" class="s">flow-through</text>
  <rect x="290" y="190" width="165" height="70" rx="4" class="box"/>
  <text x="300" y="212" class="t">U6 TPD4E05U06</text>
  <text x="300" y="230" class="s">HANDSHAKE, DATA_READY,</text>
  <text x="300" y="246" class="s">EN</text>
  <path d="M230,140 L290,140" class="ln"/>
  <path d="M230,225 L290,225" class="ln"/>

  <!-- module -->
  <rect x="520" y="60" width="270" height="300" rx="6" class="mcu"/>
  <text x="530" y="84" class="h">U1 ESP32-C5-WROOM-1U-N8R8</text>
  <text x="530" y="110" class="s">GPIO6  SCK (in)</text>
  <text x="530" y="128" class="s">GPIO7  MOSI (in)</text>
  <text x="530" y="146" class="s">GPIO2  MISO (out, R4 33 Ω)</text>
  <text x="530" y="164" class="s">GPIO10 CS (in)</text>
  <text x="530" y="188" class="s">GPIO3  HANDSHAKE (out)</text>
  <text x="530" y="206" class="s">GPIO4  DATA_READY (out)</text>
  <text x="530" y="224" class="s">EN     ← R2 470 Ω; R1 10k / C3 1 µF</text>
  <text x="530" y="248" class="s">GPIO9  PWR_SRC_HOST (in)</text>
  <text x="530" y="266" class="s">GPIO28 BOOT strap (R3, SW2)</text>
  <text x="530" y="284" class="s">GPIO24 status LED D1</text>
  <text x="530" y="302" class="s">GPIO11/12 UART0 → TP1/TP2</text>
  <text x="530" y="320" class="s">GPIO13/14 USB D-/D+ (R5/R6 22 Ω)</text>
  <text x="530" y="344" class="s">U.FL → Taoglas FXP831 antenna</text>
  <path d="M455,140 L520,140" class="ln"/>
  <path d="M455,225 L520,225" class="ln"/>

  <!-- USB -->
  <rect x="850" y="290" width="130" height="60" rx="4" class="src"/>
  <text x="860" y="312" class="t">J1 USB-C</text>
  <text x="860" y="330" class="s">U2 USBLC6 ESD</text>
  <path d="M850,320 L790,320" class="ln"/>

  <!-- buttons -->
  <rect x="850" y="150" width="130" height="80" rx="4" class="box"/>
  <text x="860" y="172" class="t">SW1 RESET</text>
  <text x="860" y="190" class="s">EN to GND</text>
  <text x="860" y="210" class="t">SW2 BOOT</text>
  <text x="860" y="226" class="s">GPIO28 to GND</text>
  <path d="M850,190 L790,224" class="ln"/>
  <path d="M850,215 L790,266" class="ln"/>

  <!-- power -->
  <rect x="20" y="410" width="160" height="50" rx="4" class="src"/>
  <text x="30" y="431" class="t">+3V3_HOST (J2 2/4/6)</text>
  <text x="30" y="448" class="s">D4 TVS</text>
  <rect x="20" y="480" width="160" height="50" rx="4" class="src"/>
  <text x="30" y="501" class="t">J1 VBUS</text>
  <text x="30" y="518" class="s">D2 TVS → F1 PTC</text>
  <rect x="220" y="480" width="140" height="50" rx="4" class="box"/>
  <text x="230" y="501" class="t">U4 AP7361C</text>
  <text x="230" y="518" class="s">5 V → 3.3 V</text>
  <rect x="410" y="415" width="170" height="90" rx="5" class="mcu"/>
  <text x="420" y="437" class="t">U3 TPS2116</text>
  <text x="420" y="456" class="s">VIN1 host (priority)</text>
  <text x="420" y="473" class="s">VIN2 USB LDO</text>
  <text x="420" y="490" class="s">ST → GPIO9 (high = host)</text>
  <rect x="640" y="430" width="150" height="60" rx="4" class="rail"/>
  <text x="650" y="453" class="t">+3V3</text>
  <text x="650" y="471" class="s">module, LEDs, U2 rail</text>
  <path d="M180,435 L410,435" class="ln"/>
  <path d="M180,505 L220,505" class="ln"/>
  <path d="M360,505 L380,505 L380,485 L410,485" class="ln"/>
  <path d="M580,460 L640,460" class="ln"/>
  <path d="M715,430 L715,360" class="ln"/>
</svg>
