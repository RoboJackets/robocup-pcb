<text x="44" y="452" fill="#222">Changed against the prototype: STM32 MOSI PD6 &#8594; PB5 (AF7), CS PB5 &#8594; PG15; ESP32 HANDSHAKE GPIO3 &#8594; GPIO0, DATA_READY GPIO4 &#8594; GPIO3.</text>
<text x="44" y="474" fill="#222">Pull resistors live on the radio (R16-R18). With no radio fitted, enable the STM32 pull-downs on PB6/PB7.</text>
